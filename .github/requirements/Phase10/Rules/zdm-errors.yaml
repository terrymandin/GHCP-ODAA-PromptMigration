errors:
  PRGZ-3127:
    id: ERR-PRGZ-3127
    description: "Required migration parameter missing or ignored (commonly TARGETDATABASEUNIQUENAME family)"
    applies_to: [ONLINE_PHYSICAL, OFFLINE_PHYSICAL]
    likely_causes:
      - "Source or target DB unique name omitted from migration inputs"
      - "Legacy parameter name used instead of 26.1 parameter name"
    remediation:
      - "Populate SOURCE_DATABASE_UNIQUE_NAME and TARGET_DATABASE_UNIQUE_NAME"
      - "Re-validate RSP names against Layer 0 mappings and Rules/26.1 catalog"

  PRGZ-2101:
    id: ERR-PRGZ-2101
    description: "Source and target character set mismatch"
    applies_to: [ONLINE_PHYSICAL, OFFLINE_PHYSICAL]
    likely_causes:
      - "Target provisioned with different NLS_CHARACTERSET"
    remediation:
      - "Align target character set with source"
      - "If alignment is not possible, move to logical migration path"

  PRGZ-3111:
    id: ERR-PRGZ-3111
    description: "TDE keystore password required for PASSWORD wallet"
    applies_to: [ONLINE_PHYSICAL, OFFLINE_PHYSICAL]
    likely_causes:
      - "Source wallet type is PASSWORD but -tdekeystorepasswd was omitted"
    remediation:
      - "Add -tdekeystorepasswd using an environment variable placeholder"
      - "Keep secret out of files; inject value at runtime"

  PRGZ-3928:
    id: ERR-PRGZ-3928
    description: "Source database identifier mismatch or wrong source host context"
    applies_to: [ONLINE_PHYSICAL, OFFLINE_PHYSICAL]
    likely_causes:
      - "Used -sourcesid for Grid Infrastructure managed source"
      - "Used -sourcedb for standalone source"
      - "Set -sourcenode to ZDM host instead of source DB host"
    remediation:
      - "Use SOURCE_GI_TYPE to choose -sourcedb vs -sourcesid"
      - "Set -sourcenode to SOURCE_HOST"

  PRGT-1017:
    id: ERR-PRGT-1017
    description: "PATCH_CHECK failed due to one-off patch comparison"
    applies_to: [ONLINE_PHYSICAL, OFFLINE_PHYSICAL]
    likely_causes:
      - "Target RU is higher but does not list source one-offs individually"
    remediation:
      - "Confirm target RU is greater than or equal to source RU"
      - "Add -ignore PATCH_CHECK to eval and migrate commands with justification"

  PRCG-1054:
    id: ERR-PRCG-1054
    description: "Required ASM disk group parameters missing for Exadata target"
    applies_to: [ONLINE_PHYSICAL, OFFLINE_PHYSICAL]
    likely_causes:
      - "TGT_REDODG or TGT_RECODG missing for EXACS/EXACC platform type"
    remediation:
      - "Populate TGT_REDODG and TGT_RECODG from target ASM discovery"

  PRGZ-4002:
    id: ERR-PRGZ-4002
    description: "Character set prerequisite failed"
    applies_to: [ONLINE_PHYSICAL, OFFLINE_PHYSICAL]
    likely_causes:
      - "Character set values diverged between source and target after reprovisioning"
    remediation:
      - "Re-run charset validation and align target before eval"